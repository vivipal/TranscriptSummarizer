services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8000"   # FastAPI
      - "8501:8501"   # Streamlit
    volumes:
      - ./:/app
      - whisper-models:/root/.cache/whisper  # Persist Whisper models
      - phi-models:/root/.cache/huggingface  # Persist Phi and other HF models
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama  # Persist Ollama models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

# Define named volumes
volumes:
  whisper-models:
  phi-models:
  ollama-models:
